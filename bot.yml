name: ISC Clan Bot
version: 1.0
type: python
main_file: isc_clan_bot.py
python_version: "3.10"

requirements:
  file: requirements.txt
  install: pip install -r requirements.txt

bot_settings:
  prefix: "!"
  token_env: BOT_TOKEN
  intents:
    - message_content
    - members
    - guilds

features:
  leveling: true
  welcome: true
  moderation: true
  fun: true
  roles: true

startup_command: python isc_clan_bot.py

env_variables:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

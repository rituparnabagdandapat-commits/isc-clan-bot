name: Build ISC Clan Bot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check bot syntax
        run: |
          python -m py_compile isc_clan_bot.py
          echo "✅ Build successful - No errors!"

      - name: List files
        run: |
          ls -la
          echo "✅ ISC Clan Bot build complete"

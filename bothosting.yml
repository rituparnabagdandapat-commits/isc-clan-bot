# bothosting.net - ISC Clan Ultra Bot
bot:
  name: ISC Clan Bot
  main_file: main.py
  python_version: 3.11
  install_command: pip install -r requirements.txt
  start_command: python main.py
  auto_restart: true
  files:
    - main.py
    - extra.py
    - requirements.txt
    - economy.json
    - invites.json
    - levels.json
    - wars.json
    - README.txt
settings:
  ram: 512
  autorestart: true
  autoupdate: true

startup:
  install: pip install -r requirements.txt
  run: python main.py

env:
    - DISCORD_TOKEN

dependencies:
    - Pillow
    - aiohttp
    - yt-dlp
    - PyNaCl
    - discord.py>=2.3.0
